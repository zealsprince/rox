# Publishes release bumps to the three AUR packages: rox-player builds the
# tagged tarball, rox-player-bin installs the release's linux-x86_64 tarball,
# rox-player-git builds HEAD. The PKGBUILDs live in their AUR repos and have
# a primary maintainer of their own, so this edits them in place instead of
# overwriting them from a template kept here: version, pkgrel, and checksum
# for rox-player and rox-player-bin, just the displayed pkgver for
# rox-player-git, whose pkgver() computes the real one at build time. Both
# versioned updates are test-built in a clean Arch container before any
# package is pushed, so a missing system dep or a vendor script break stops
# here instead of on every AUR user's machine. A rox-player-bin failure only
# holds back rox-player-bin itself.
#
# A release candidate can't push any package: rox-player tracks stable and
# a pkgver won't hold the hyphen in 1.25.0-rc.1. It still test-builds, which is
# the point of cutting one. rox-player-git is the package that fits there,
# since its source is the git tree and pointing it at the candidate tag needs
# no version rewrite, and its prepare() and build() are the same recipe
# rox-player runs on the tarball. So a missing vendor script or system dep
# fails on the candidate, days before the stable tag reaches AUR users.
#
# Runs as a job of the Release workflow (see the note there on why a
# `release: published` trigger can't work). The manual dispatch is for
# re-pushing a version when a run failed after the release itself shipped, and
# always takes the push path: `candidate` is a workflow_call input only.
#
# Needs one secret, AUR_SSH_PRIVATE_KEY: a private key whose public half is
# registered on an AUR account with co-maintainer access to all three packages.
# When it's unset the run warns and skips, same as the website rebuild.
name: AUR

on:
  workflow_call:
    inputs:
      version:
        description: Release version, without the leading v
        required: true
        type: string
      candidate:
        description: Test-build the packaging without touching the AUR
        required: false
        default: false
        type: boolean
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the leading v
        required: true
        type: string

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ inputs.version }}
    steps:
      # `if:` can't read secrets on a step, so gate through a step output.
      # Two answers, not one: `build` is whether there's anything to do at all,
      # `push` is whether it may reach the AUR. A candidate builds without the
      # key; a stable run with no key has nothing left worth the container time.
      - name: Decide what this run does
        id: gate
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if [ "$CANDIDATE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$AUR_SSH_PRIVATE_KEY" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AUR_SSH_PRIVATE_KEY not set, skipping the AUR update"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      # makepkg refuses to run as root, so the build side goes through a
      # throwaway user with passwordless sudo (makepkg -s installs deps via
      # pacman). Root keeps the git side; safe.directory covers the mixed
      # ownership that leaves behind.
      - name: Set up container
        if: steps.gate.outputs.build == 'true'
        run: |
          pacman -Syu --noconfirm git openssh
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          git config --global --add safe.directory '*'
          git config --global user.name zealsprince
          git config --global user.email andrew@zealsprince.com

      - name: Set up SSH
        if: steps.gate.outputs.push == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        # Everything goes through GIT_SSH_COMMAND with explicit paths. In a
        # container job $HOME is /github/home while ssh resolves ~/.ssh from
        # the passwd entry (/root), so files placed in either one's .ssh are
        # invisible to the other; naming the files sidesteps the split.
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          # Trust is pinned to the Ed25519 fingerprint aur.archlinux.org
          # publishes on its home page, not whatever keyscan happens to see.
          ssh-keyscan -t ed25519 aur.archlinux.org > "$HOME/.ssh/aur_known_hosts" 2>/dev/null
          fingerprint=$(ssh-keygen -lf "$HOME/.ssh/aur_known_hosts" | awk '{print $2}')
          if [ "$fingerprint" != "SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4" ]; then
            echo "::error::aur.archlinux.org host key doesn't match the published fingerprint"
            exit 1
          fi
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/aur_known_hosts" >> "$GITHUB_ENV"

      # The binary package takes its checksum from the release's own
      # SHA256SUMS.txt, so it matches the asset the release job uploaded. The
      # release job runs before this one, so the asset is already there.
      # These two steps may fail without failing the job: rox-player-bin has
      # a primary maintainer of its own, and a break there must not hold back
      # rox-player and rox-player-git. Push checks bin_test's outcome.
      - name: Update rox-player-bin
        id: bin_update
        if: steps.gate.outputs.push == 'true'
        continue-on-error: true
        run: |
          git clone ssh://aur@aur.archlinux.org/rox-player-bin.git
          cd rox-player-bin
          curl -fsSLo SHA256SUMS.txt \
            "https://github.com/zealsprince/rox/releases/download/v$VERSION/SHA256SUMS.txt"
          sha=$(awk -v f="rox-v$VERSION-linux-x86_64.tar.gz" '$2 == f { print $1 }' SHA256SUMS.txt)
          rm SHA256SUMS.txt
          if [ -z "$sha" ]; then
            echo "::error::No linux-x86_64 tarball checksum in SHA256SUMS.txt for v$VERSION"
            exit 1
          fi
          sed -i \
            -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$sha')/" \
            PKGBUILD
          chown -R builder .
          sudo -Hu builder makepkg --printsrcinfo > .SRCINFO

      # No compile here, so this mostly checks the download, the checksum and
      # the tarball layout package() expects.
      - name: Test build rox-player-bin
        id: bin_test
        if: steps.gate.outputs.push == 'true' && steps.bin_update.outcome == 'success'
        continue-on-error: true
        run: |
          cd rox-player-bin
          sudo -Hu builder makepkg -s --noconfirm

      # The checksum comes from hashing the tag tarball ourselves, the same
      # trust model updpkgsums uses. The download keeps makepkg's expected
      # filename so the test build reuses it instead of fetching again.
      - name: Update rox-player
        if: steps.gate.outputs.push == 'true'
        run: |
          git clone ssh://aur@aur.archlinux.org/rox-player.git
          cd rox-player
          curl -fsSLo "rox-player-$VERSION.tar.gz" \
            "https://github.com/zealsprince/rox/archive/refs/tags/v$VERSION.tar.gz"
          sha=$(sha256sum "rox-player-$VERSION.tar.gz" | cut -d' ' -f1)
          sed -i \
            -e "s/^pkgver=.*/pkgver=$VERSION/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$sha')/" \
            PKGBUILD
          chown -R builder .
          sudo -Hu builder makepkg --printsrcinfo > .SRCINFO

      - name: Test build rox-player
        if: steps.gate.outputs.push == 'true'
        run: |
          cd rox-player
          sudo -Hu builder makepkg -s --noconfirm

      # The candidate half of the same check, over https because nothing here
      # needs the key. The source is pinned to the tag rather than left on the
      # default branch: main can move while this runs, and the point is to
      # build the commit that was just released.
      - name: Test build rox-player-git
        if: inputs.candidate
        run: |
          git clone https://aur.archlinux.org/rox-player-git.git
          cd rox-player-git
          sed -i "s|git+\$url.git|&#tag=v$VERSION|" PKGBUILD
          chown -R builder .
          sudo -Hu builder makepkg -s --noconfirm

      # The repo's pkgver is only what the AUR page displays (pkgver() computes
      # the real one at install time), but left stale it reads abandoned, so
      # mirror pkgver()'s transform on the fresh tag.
      - name: Update rox-player-git
        if: steps.gate.outputs.push == 'true'
        run: |
          git clone ssh://aur@aur.archlinux.org/rox-player-git.git
          git clone --filter=blob:none --no-checkout \
            https://github.com/zealsprince/rox rox-src
          gitver=$(git -C rox-src describe --long --tags "v$VERSION" |
            sed 's/^v//;s/\([^-]*-g\)/r\1/;s/-/./g')
          cd rox-player-git
          sed -i \
            -e "s/^pkgver=.*/pkgver=$gitver/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            PKGBUILD
          chown -R builder .
          sudo -Hu builder makepkg --printsrcinfo > .SRCINFO

      # Explicit adds so makepkg leftovers (src/, pkg/, the tarball) never
      # ride along. Skipping a no-op diff keeps dispatch re-runs idempotent.
      # rox-player-bin goes last and only after its test build passed, so a
      # failed push there can't stop the other two.
      - name: Push
        if: steps.gate.outputs.push == 'true'
        env:
          BIN_TEST: ${{ steps.bin_test.outcome }}
        run: |
          pkgs="rox-player rox-player-git"
          if [ "$BIN_TEST" = "success" ]; then
            pkgs="$pkgs rox-player-bin"
          else
            echo "::warning::rox-player-bin update or test build failed, not pushing it"
          fi
          for pkg in $pkgs; do
            git -C "$pkg" add PKGBUILD .SRCINFO
            if git -C "$pkg" diff --cached --quiet; then
              echo "$pkg is already at v$VERSION"
            else
              git -C "$pkg" commit -m "Update to v$VERSION"
              git -C "$pkg" push
            fi
          done
