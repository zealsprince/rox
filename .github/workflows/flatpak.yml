# Builds the Flatpak from scripts/flatpak/com.zealsprince.rox.yml as one leg
# of a release: lints the manifest and the metainfo, builds in Flathub's own
# CI image, lints the resulting repo, and hands the sideload bundle to the
# release job as an artifact, so it lands beside the tarball, the deb and the
# AppImage and in SHA256SUMS.txt. It has to go that way round: a published
# release here is immutable, so nothing can be attached to it afterwards.
# Pushing the manifest to Flathub is flathub.yml's job, after the release
# exists.
#
# The manifest builds offline from pinned sources. scripts/flatpak/prepare.sh
# writes the tree for the version being built under $RUNNER_TEMP: the
# manifest with the rox source pinned to the release commit and the crate
# list flatpak-cargo-generator derives from that commit's Cargo.lock. The
# metainfo is the rox source's own. The checked-in manifest stays
# untouched and keeps pointing at the newest published tag, so it builds as
# committed.
#
# On a release run the commit comes from the caller and the packaging files
# from the same checkout. The manual dispatch rebuilds a published version
# from its tag, with the packaging files from the ref it was dispatched on,
# so a re-run after a fix sees the fix. Its bundle stays a run artifact: the
# release it belongs to can't take it any more.
name: Flatpak

on:
  workflow_call:
    inputs:
      version:
        description: Release version, without the leading v
        required: true
        type: string
      commit:
        description: The commit being released, which the tag will point at
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Release version, without the leading v
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Flathub's CI image: flatpak-builder, flatpak-builder-lint and the 25.08
    # runtime and SDK preinstalled, so the run downloads nothing the build
    # itself doesn't need. Privileged because flatpak-builder sandboxes each
    # module with bubblewrap, which needs the user namespaces the default
    # container profile blocks. The tag has to match the manifest's
    # runtime-version; bump both together.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    env:
      VERSION: ${{ inputs.version }}
      MANIFEST: com.zealsprince.rox.yml
      BUNDLE: rox-v${{ inputs.version }}-flatpak-x86_64.flatpak
    steps:
      - uses: actions/checkout@v7

      # A dispatch names a version, not a commit: the tag says which. The
      # peeled ref (^{}) is the commit behind an annotated tag; a lightweight
      # tag has no peeled line and is the commit itself. Either way it's the
      # last line. The url rather than "origin": in the container git won't
      # read the checkout's config until the workspace is marked safe, and
      # a remote lookup doesn't need the checkout at all.
      - name: Resolve the commit
        id: commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          if [ -z "$COMMIT" ]; then
            COMMIT=$(git ls-remote --tags https://github.com/zealsprince/rox.git \
              "refs/tags/v$VERSION" "refs/tags/v$VERSION^{}" | tail -n1 | cut -f1)
          fi
          if [ -z "$COMMIT" ]; then
            echo "::error::no tag v$VERSION on origin and no commit given"
            exit 1
          fi
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

      # The generator's two dependencies; pip is in the SDK, the generator
      # itself is fetched by prepare.sh. The tree's git ownership is mixed
      # (root in the container, the runner on the host), which git refuses
      # until the workspace is marked safe: the same thing the AUR job does.
      # The cache key further down is the crate list's hash: same crates,
      # same compiled state, whatever the version.
      - name: Prepare the Flathub tree
        id: prepare
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          pip3 install --user aiohttp tomlkit
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          scripts/flatpak/prepare.sh "$VERSION" "$COMMIT" "$RUNNER_TEMP/flathub"
          echo "lock=$(sha256sum "$RUNNER_TEMP/flathub/cargo-sources.json" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # The checks Flathub runs on a submission, before half an hour goes
      # into the build, on the copy Flathub would get. The linter is on the
      # image's PATH. The appstream check runs on the metainfo at the commit
      # being built, which is the file the build installs; on a dispatch the
      # checkout can be a newer ref, so it's fetched rather than read.
      - name: Lint manifest and metainfo
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
        run: |
          flatpak-builder-lint manifest "$RUNNER_TEMP/flathub/$MANIFEST"
          curl -fsSLo "$RUNNER_TEMP/rox.metainfo.xml" \
            "https://raw.githubusercontent.com/zealsprince/rox/$COMMIT/crates/rox/assets/app/rox.metainfo.xml"
          flatpak-builder-lint appstream "$RUNNER_TEMP/rox.metainfo.xml"

      # v6.8, master as of 2026-08-25. The upstream flatpak/ action, not the
      # flathub-infra fork: that fork closed in 2025-04 and never learned
      # --compose-url-policy=full, which flatpak-builder 1.4.6 needs or the
      # catalogue comes out with relative media paths the repo lint rejects.
      # Upstream adds the flag itself whenever the mirror url is set. The
      # action leaves the OSTree repo in repo/ and the bundle in the
      # workspace; the cache is flatpak-builder's state dir. The mirror url
      # is what Flathub's own build passes: flatpak-builder rewrites the
      # metainfo's screenshot urls to dl.flathub.org and the action commits
      # the downloaded media into the repo's screenshots/x86_64 branch.
      # Compose runs in flatpak-builder's cleanup stage, whose cache checksum
      # covers the manifest but not command-line options, so a cache built
      # under other compose flags skips compose forever. The "full-urls"
      # segment names the flags this cache was built with; change it when
      # they change.
      - uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3
        with:
          manifest-path: ${{ runner.temp }}/flathub/build/com.zealsprince.rox.yml
          bundle: rox-v${{ inputs.version }}-flatpak-x86_64.flatpak
          cache-key: flatpak-full-urls-${{ steps.prepare.outputs.lock }}
          mirror-screenshots-url: https://dl.flathub.org/media
          upload-artifact: false

      - name: Lint repo
        run: flatpak-builder-lint repo repo

      # Same shape as the build matrix's upload: the release job downloads
      # every artifact into one folder and creates the release from it.
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-x86_64
          path: rox-v*.flatpak
          if-no-files-found: error
