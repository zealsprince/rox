# Builds and publishes a release when a push to main bumps the workspace
# version. Triggers off the CI workflow finishing on main rather than the push
# itself, so a release never ships from a commit that fails fmt, clippy, or
# tests. The version gate is tag existence, not commit diffing: if v<version>
# is already tagged, nothing runs, so re-runs and non-bump commits are no-ops
# and a failed run can be retried safely.
#
# A release candidate is the same push with a semver prerelease suffix on the
# workspace version (1.25.0-rc.1). It builds and tags like any other version
# and publishes as a GitHub prerelease, which keeps it off the "latest"
# endpoint the site and the in-app check read for stable builds; both offer
# candidates only to people who opted in. The AUR isn't updated for candidates,
# since rox-player tracks stable and pacman versions can't carry the hyphen
# anyway, but the candidate does test-build the packaging so a break there
# surfaces here instead of on the stable tag. Cutting the release itself is
# then a bump to the bare version.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    # CI also runs on pull requests; the branches filter above matches the head
    # branch, so require the triggering run to be a green push to be safe. A
    # manual dispatch skips the gate on purpose: it's the escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Decide whether this version needs a release
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # A hyphen is semver's prerelease marker, and cargo has already
          # refused anything that isn't a version.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux leg builds inside Debian bookworm: glibc 2.36 is the
          # floor the AppImage promises, and the tarball and deb inherit it,
          # which takes Debian 12 along. The other two entries leave the key
          # out, which evaluates to empty and runs straight on the runner.
          - os: ubuntu-latest
            artifact: linux-x86_64
            container: debian:bookworm
          - os: macos-latest
            artifact: macos-aarch64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    # Job-level so `cargo build` picks the api identities up without a per-step
    # env block, and so the macOS steps can gate on `env.X != ''` (a step's own
    # env isn't visible to its `if`). Every one is optional: a fork or a run
    # without the secrets set builds fine, it just ships no built-in identity
    # and signs the app ad-hoc.
    env:
      VERSION: ${{ needs.check.outputs.version }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      ACOUSTID_CLIENT_KEY: ${{ secrets.ACOUSTID_CLIENT_KEY }}
    steps:
      # Before the checkout, because the bookworm image is bare: without git
      # in it actions/checkout falls back to a REST tarball with no .git,
      # and the metainfo fill and the projectM vendoring both need a real
      # clone. We're root in the container, so no sudo. git and curl serve
      # checkout, the toolchain installer and install-action; dpkg-dev is
      # dpkg-shlibdeps for cargo-deb's $auto; file is for appimagetool;
      # cmake is for rox-milkdrop-sys, which builds libprojectM from source;
      # imagemagick downscales the AppImage's icon to the 256px slot.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y \
            build-essential git curl ca-certificates dpkg-dev file \
            pkg-config libasound2-dev libfontconfig1-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-dev libxcb1-dev libvulkan-dev \
            libssl-dev cmake imagemagick

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # gpui's build script compiles Metal shaders with `xcrun metal`. Xcode 26
      # ships that toolchain as a separate download, so fetch it if missing.
      - name: Ensure Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # macOS packaging deletes target/ to fit the DMG, so there's nothing
          # left for the post step to save. Letting it run anyway writes a
          # useless entry under the key and every later run restores that.
          save-if: ${{ runner.os != 'macOS' }}

      # vendor/ is gitignored; [patch.crates-io] points at it, so rebuild it
      # from crates.io + patches/ before the build. The projectM source goes
      # the same way: rox-milkdrop-sys's build script refuses to run without
      # it. bash on every runner, so the Windows job gets curl, tar and
      # sha256sum from Git Bash.
      - name: Vendor patched crates and libprojectM
        shell: bash
        run: |
          scripts/vendor-gpui.sh
          scripts/vendor-projectm.sh

      # rox-mcp ships beside the app: the MCP settings page hands out a
      # config pointing at it, so every artifact has to carry it.
      - name: Build
        run: cargo build --release --package rox --package rox-mcp

      # codesign only finds an identity in a keychain, and the runner starts
      # with none, so import the Developer ID .p12 (stored base64-encoded in
      # APPLE_CERTIFICATE) into a throwaway one for the rest of the job. The
      # runner is torn down after, so the keychain goes with it.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Only ever unlocks this one keychain on this one runner.
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # Without this codesign prompts for keychain access and hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

      # The metainfo in the tree carries a marker where its release history
      # goes; the script swaps in one entry per stable tag so the tarball,
      # the deb and the AppImage all ship the filled file. The checkout has
      # no tags, so the script fetches them itself, and this version's tag
      # doesn't exist until the release job cuts it, so it goes in by name.
      - name: Fill metainfo releases
        if: runner.os == 'Linux'
        run: scripts/metainfo-releases.sh crates/rox/assets/app/rox.metainfo.xml "$VERSION"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          staging="rox-v$VERSION-${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp target/release/rox "$staging/"
          cp target/release/rox-mcp "$staging/"
          cp crates/rox/assets/app/rox.desktop "$staging/"
          cp crates/rox/assets/app/rox-music.svg "$staging/rox.svg"
          cp crates/rox/assets/app/rox.png "$staging/"
          cp crates/rox/assets/app/rox.metainfo.xml "$staging/"
          cp scripts/dist/README.txt "$staging/"
          cp LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      # Prebuilt binary instead of `cargo install`, which would compile
      # cargo-deb for minutes on every release.
      - uses: taiki-e/install-action@v2
        if: runner.os == 'Linux'
        with:
          tool: cargo-deb

      # Same binaries as the tarball, wrapped with the .desktop entry and
      # icons for menu integration and clean uninstall. Built in the bookworm
      # container, so the glibc floor is 2.36 and Debian 12 is covered along
      # with everything newer. Layout and dependencies live in
      # [package.metadata.deb] in crates/rox/Cargo.toml.
      - name: Package (Linux .deb)
        if: runner.os == 'Linux'
        run: cargo deb -p rox --no-build -o .

      # Same binaries again as one self-contained file. Nothing is bundled
      # beyond rox, rox-mcp, the desktop entry, icons and metainfo: every
      # library rox links is on the AppImage excludelist or is glibc, and
      # the bookworm build is what makes that glibc floor hold. The script
      # pins appimagetool and the static runtime by hash.
      - name: Package (Linux AppImage)
        if: runner.os == 'Linux'
        run: scripts/appimage/build.sh "$VERSION" .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p rox.app/Contents/MacOS rox.app/Contents/Resources
          cp target/release/rox rox.app/Contents/MacOS/
          # Beside the app binary, where the MCP settings page says it is.
          cp target/release/rox-mcp rox.app/Contents/MacOS/
          cp crates/rox/assets/app/rox.icns rox.app/Contents/Resources/
          sed "s/__VERSION__/$VERSION/" crates/rox/assets/app/Info.plist \
            > rox.app/Contents/Info.plist
          # The arm64 runner only has ~14 GB of disk and the release build
          # fills most of it, which left hdiutil below with no room to write
          # the image ("No space left on device" copying into /Volumes/rox).
          # Everything we ship is in the bundle now, so drop the build tree.
          rm -rf target
          df -h /
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            # Hardened runtime and a timestamp are what notarization checks
            # for, so they have to go on before the submit step below. Signing
            # the bundle only covers the main executable, and notarization
            # rejects any unsigned Mach-O inside, so rox-mcp gets its own
            # signature first (inside-out order, or the outer seal breaks).
            codesign --force --timestamp --options runtime \
              -s "$APPLE_SIGNING_IDENTITY" rox.app/Contents/MacOS/rox-mcp
            codesign --force --timestamp --options runtime \
              -s "$APPLE_SIGNING_IDENTITY" rox.app
            codesign --verify --strict --verbose=2 rox.app
          else
            echo "::warning::no Apple signing identity, falling back to ad-hoc"
            codesign --force --deep -s - rox.app
          fi
          # Styled drag-to-install image (background, icon layout). The DMG
          # gets its own signature so Gatekeeper judges the container as well
          # as the app inside.
          scripts/make-dmg.sh rox.app "rox-v$VERSION-${{ matrix.artifact }}.dmg"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --timestamp -s "$APPLE_SIGNING_IDENTITY" \
              "rox-v$VERSION-${{ matrix.artifact }}.dmg"
          fi

      # Notarization is what clears the Gatekeeper warning on downloaded
      # builds; the stapled ticket keeps it cleared offline. Skipped without
      # the API key or a real signing identity, since Apple rejects ad-hoc
      # submissions anyway. Submit and wait are split so a rejection can pull
      # the log, which is the only place Apple says why.
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY != '' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          dmg="rox-v$VERSION-${{ matrix.artifact }}.dmg"
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          auth=(--key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          id=$(xcrun notarytool submit "$dmg" "${auth[@]}" \
            --output-format json | jq -r '.id')
          if ! xcrun notarytool wait "$id" "${auth[@]}" --timeout 30m; then
            xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
          rm "$RUNNER_TEMP/notary-key.p8"
          xcrun stapler staple "$dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/rox.exe, target/release/rox-mcp.exe, `
            scripts/dist/README.txt, LICENSE `
            -DestinationPath "rox-v$env:VERSION-${{ matrix.artifact }}.zip"

      # Inno Setup wizard around the same binaries: Start Menu shortcut,
      # Add/Remove Programs entry, in-place upgrades. ISCC is preinstalled on
      # the Windows runners. Unsigned, so SmartScreen warns on first run, same
      # as the zip; a signing certificate is blocked on legal logistics for
      # now.
      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DVersion=$env:VERSION scripts\rox.iss

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            rox-v*.tar.gz
            rox-v*.zip
            rox-v*.dmg
            rox-v*-setup.exe
            rox-v*.AppImage
            rox_*.deb
          if-no-files-found: error

  # The Flatpak leg sits before the release, unlike the AUR and Flathub
  # jobs below: a published release here is immutable, so the bundle has to
  # be in the set the release is created from. It builds the same vetted
  # commit the matrix does; the tag doesn't exist yet, so the manifest it
  # builds pins the commit alone.
  flatpak:
    needs: check
    if: needs.check.outputs.release == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/flatpak.yml
    with:
      version: ${{ needs.check.outputs.version }}
      commit: ${{ github.event.workflow_run.head_sha || github.sha }}

  release:
    needs: [check, build, flatpak]
    # always() so a Flatpak failure never holds the release: the other
    # channels ship without the bundle, and once the leg is fixed a dispatch
    # of flatpak.yml rebuilds it as a run artifact. The matrix stays
    # required, and the version gate still applies.
    if: >-
      always() &&
      needs.check.outputs.release == 'true' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # One sha256sum line per artifact, published beside them. The in-app
      # updater downloads this first and refuses any artifact whose bytes
      # don't hash to its entry, so a truncated or tampered download never
      # gets installed.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      # The generated notes start at the newest stable tag rather than at
      # whatever GitHub picks as the previous release: a candidate's notes
      # then cover everything since the last release, and the release that
      # follows a run of candidates covers the same span instead of only the
      # commits since rc.N. The checkout has no tags, so ask the remote.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
          # Under workflow_run, github.sha is the default branch tip at trigger
          # time, which can drift past the commit CI actually vetted. Tag the
          # vetted one.
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          previous=$(git ls-remote --tags --refs origin 'v[0-9]*' |
            sed 's|.*refs/tags/||' | grep -v -e '-' | sort -V | tail -n1)
          flags=()
          if [ -n "$previous" ]; then
            flags+=(--notes-start-tag "$previous")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" \
            --target "$TARGET_SHA" \
            --title "v$VERSION" \
            --generate-notes "${flags[@]}" \
            artifacts/*

      # rox.music bakes the version and asset URLs into its download page at
      # build time, so it only learns about a release when something tells it to
      # rebuild. github.token cannot reach another repo, so this needs a PAT with
      # contents:write on rox.music, stored as ROX_WEBSITE_TOKEN. Candidates
      # dispatch too: the site lists the newest one beside the stable download.
      #
      # continue-on-error because a missing or expired secret is not worth
      # failing a good release over. The site keeps serving the previous version
      # until its next build, and the step goes yellow to say so.
      - name: Rebuild rox.music
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ROX_WEBSITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ROX_WEBSITE_TOKEN not set, rox.music will not rebuild"
            exit 0
          fi
          gh api repos/zealsprince/rox.music/dispatches \
            --field event_type=rox-release \
            --field "client_payload[version]=${{ needs.check.outputs.version }}" \
            --field "client_payload[prerelease]=${{ needs.check.outputs.prerelease }}"

  # The AUR update can't hang off `release: published` in its own workflow:
  # the release above is created with github.token, and events made with that
  # token never trigger other workflows. Chaining it as a job is what makes it
  # run at all.
  aur:
    needs: [check, release]
    # Candidates never reach the AUR: rox-player is the stable package, and
    # a pkgver can't hold the hyphen anyway. They still run the job, which
    # test-builds the packaging against the tag it just cut, so a break in
    # prepare() or a new system dep fails on the candidate rather than on the
    # stable release. The stable release that follows publishes as usual.
    permissions: {}
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.check.outputs.version }}
      candidate: ${{ needs.check.outputs.prerelease == 'true' }}
    secrets: inherit

  # Chained here for the reason the AUR job gives above. The bundle itself
  # was built before the release by the flatpak job; this pushes the
  # manifest to the Flathub repo, which tracks stable, so a candidate only
  # prepares the tree.
  flathub:
    needs: [check, release]
    permissions: {}
    uses: ./.github/workflows/flathub.yml
    with:
      version: ${{ needs.check.outputs.version }}
      candidate: ${{ needs.check.outputs.prerelease == 'true' }}
    secrets: inherit
