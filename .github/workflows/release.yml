# Builds and publishes a release when a push to main bumps the workspace
# version. Triggers off the CI workflow finishing on main rather than the push
# itself, so a release never ships from a commit that fails fmt, clippy, or
# tests. The version gate is tag existence, not commit diffing: if v<version>
# is already tagged, nothing runs, so re-runs and non-bump commits are no-ops
# and a failed run can be retried safely.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    # CI also runs on pull requests; the branches filter above matches the head
    # branch, so require the triggering run to be a green push to be safe. A
    # manual dispatch skips the gate on purpose: it's the escape hatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Decide whether this version needs a release
        id: version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x86_64
          - os: macos-latest
            artifact: macos-aarch64
          - os: windows-latest
            artifact: windows-x86_64
    runs-on: ${{ matrix.os }}
    # Job-level so `cargo build` picks the api identities up without a per-step
    # env block, and so the macOS steps can gate on `env.X != ''` (a step's own
    # env isn't visible to its `if`). Every one is optional: a fork or a run
    # without the secrets set builds fine, it just ships no built-in identity
    # and signs the app ad-hoc.
    env:
      VERSION: ${{ needs.check.outputs.version }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libfontconfig1-dev libwayland-dev \
            libxkbcommon-x11-dev libx11-dev libxcb1-dev libvulkan-dev \
            libssl-dev

      # gpui's build script compiles Metal shaders with `xcrun metal`. Xcode 26
      # ships that toolchain as a separate download, so fetch it if missing.
      - name: Ensure Metal toolchain
        if: runner.os == 'macOS'
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # macOS packaging deletes target/ to fit the DMG, so there's nothing
          # left for the post step to save. Letting it run anyway writes a
          # useless entry under the key and every later run restores that.
          save-if: ${{ runner.os != 'macOS' }}

      # vendor/ is gitignored; [patch.crates-io] points at it, so rebuild it
      # from crates.io + patches/ before the build.
      - name: Vendor patched crates
        shell: bash
        run: scripts/vendor-gpui.sh

      # rox-mcp ships beside the app: the MCP settings page hands out a
      # config pointing at it, so every artifact has to carry it.
      - name: Build
        run: cargo build --release --package rox --package rox-mcp

      # codesign only finds an identity in a keychain, and the runner starts
      # with none, so import the Developer ID .p12 (stored base64-encoded in
      # APPLE_CERTIFICATE) into a throwaway one for the rest of the job. The
      # runner is torn down after, so the keychain goes with it.
      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Only ever unlocks this one keychain on this one runner.
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          # Without this codesign prompts for keychain access and hangs.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          staging="rox-v$VERSION-${{ matrix.artifact }}"
          mkdir -p "$staging"
          cp target/release/rox "$staging/"
          cp target/release/rox-mcp "$staging/"
          cp crates/rox/assets/app/rox.desktop "$staging/"
          cp crates/rox/assets/app/rox-music.svg "$staging/rox.svg"
          cp crates/rox/assets/app/rox.png "$staging/"
          cp LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p rox.app/Contents/MacOS rox.app/Contents/Resources
          cp target/release/rox rox.app/Contents/MacOS/
          # Beside the app binary, where the MCP settings page says it is.
          cp target/release/rox-mcp rox.app/Contents/MacOS/
          cp crates/rox/assets/app/rox.icns rox.app/Contents/Resources/
          sed "s/__VERSION__/$VERSION/" crates/rox/assets/app/Info.plist \
            > rox.app/Contents/Info.plist
          # The arm64 runner only has ~14 GB of disk and the release build
          # fills most of it, which left hdiutil below with no room to write
          # the image ("No space left on device" copying into /Volumes/rox).
          # Everything we ship is in the bundle now, so drop the build tree.
          rm -rf target
          df -h /
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            # Hardened runtime and a timestamp are what notarization checks
            # for, so they have to go on before the submit step below. Signing
            # the bundle only covers the main executable, and notarization
            # rejects any unsigned Mach-O inside, so rox-mcp gets its own
            # signature first (inside-out order, or the outer seal breaks).
            codesign --force --timestamp --options runtime \
              -s "$APPLE_SIGNING_IDENTITY" rox.app/Contents/MacOS/rox-mcp
            codesign --force --timestamp --options runtime \
              -s "$APPLE_SIGNING_IDENTITY" rox.app
            codesign --verify --strict --verbose=2 rox.app
          else
            echo "::warning::no Apple signing identity, falling back to ad-hoc"
            codesign --force --deep -s - rox.app
          fi
          # Styled drag-to-install image (background, icon layout). The DMG
          # gets its own signature so Gatekeeper judges the container as well
          # as the app inside.
          scripts/make-dmg.sh rox.app "rox-v$VERSION-${{ matrix.artifact }}.dmg"
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --timestamp -s "$APPLE_SIGNING_IDENTITY" \
              "rox-v$VERSION-${{ matrix.artifact }}.dmg"
          fi

      # Notarization is what clears the Gatekeeper warning on downloaded
      # builds; the stapled ticket keeps it cleared offline. Skipped without
      # the API key or a real signing identity, since Apple rejects ad-hoc
      # submissions anyway. Submit and wait are split so a rejection can pull
      # the log, which is the only place Apple says why.
      - name: Notarize (macOS)
        if: runner.os == 'macOS' && env.APPLE_API_KEY != '' && env.APPLE_SIGNING_IDENTITY != ''
        run: |
          dmg="rox-v$VERSION-${{ matrix.artifact }}.dmg"
          echo "$APPLE_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          auth=(--key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          id=$(xcrun notarytool submit "$dmg" "${auth[@]}" \
            --output-format json | jq -r '.id')
          if ! xcrun notarytool wait "$id" "${auth[@]}" --timeout 30m; then
            xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
          rm "$RUNNER_TEMP/notary-key.p8"
          xcrun stapler staple "$dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/release/rox.exe, target/release/rox-mcp.exe, LICENSE `
            -DestinationPath "rox-v$env:VERSION-${{ matrix.artifact }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            rox-v*.tar.gz
            rox-v*.zip
            rox-v*.dmg
          if-no-files-found: error

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # One sha256sum line per artifact, published beside them. The in-app
      # updater downloads this first and refuses any artifact whose bytes
      # don't hash to its entry, so a truncated or tampered download never
      # gets installed.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          # Under workflow_run, github.sha is the default branch tip at trigger
          # time, which can drift past the commit CI actually vetted. Tag the
          # vetted one.
          TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          gh release create "v${{ needs.check.outputs.version }}" \
            --target "$TARGET_SHA" \
            --title "v${{ needs.check.outputs.version }}" \
            --generate-notes \
            artifacts/*

      # rox.music bakes the version and asset URLs into its download page at
      # build time, so it only learns about a release when something tells it to
      # rebuild. github.token cannot reach another repo, so this needs a PAT with
      # contents:write on rox.music, stored as ROX_WEBSITE_TOKEN.
      #
      # continue-on-error because a missing or expired secret is not worth
      # failing a good release over. The site keeps serving the previous version
      # until its next build, and the step goes yellow to say so.
      - name: Rebuild rox.music
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.ROX_WEBSITE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::ROX_WEBSITE_TOKEN not set, rox.music will not rebuild"
            exit 0
          fi
          gh api repos/zealsprince/rox.music/dispatches \
            --field event_type=rox-release \
            --field "client_payload[version]=${{ needs.check.outputs.version }}"

  # The AUR update can't hang off `release: published` in its own workflow:
  # the release above is created with github.token, and events made with that
  # token never trigger other workflows. Chaining it as a job is what makes it
  # run at all.
  aur:
    needs: [check, release]
    permissions: {}
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit
