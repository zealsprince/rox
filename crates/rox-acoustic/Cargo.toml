[package]
name = "rox-acoustic"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rox-core = { path = "../rox-core" }
rox-net = { path = "../rox-net" }
rox-library = { path = "../rox-library" }
rox-playback = { path = "../rox-playback" }
rox-viz = { path = "../rox-viz" }
# Candle runs the downloaded CNN in pure Rust: no libtorch or ONNX Runtime.
# It does build vendored oniguruma through tokenizers, so a build needs a C
# compiler, which rusqlite's bundled SQLite already required.
candle-core = "0.11"
candle-nn = "0.11"
sha2 = "0.10"
# Its own agent: rox-net's caps every request at ten seconds, too short for
# a 24 MB download.
ureq = "2"
log = "0.4"

# Metal for the forward pass. Kernels compile at runtime, and the extractor
# falls back to the CPU if the device or a probe pass fails.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { version = "0.11", features = ["metal"] }
candle-nn = { version = "0.11", features = ["metal"] }
