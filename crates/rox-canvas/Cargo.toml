[package]
name = "rox-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# A canvas saves as JSON inside its panel's config.
serde = { version = "1", features = ["derive"] }
# Grid dumps, shader configs and kinds this build doesn't know stay raw JSON.
serde_json = "1"
# A dropped or unknown item is logged through the app's backend.
log = "0.4"
