[package]
name = "rox-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The live setters push the palette, locale, and dock flags straight through.
rox-design = { path = "../rox-design" }
rox-i18n = { path = "../rox-i18n" }
rox-dock = { path = "../rox-dock" }
# The saved loop mode and the signal routes are these crates' types.
rox-playback = { path = "../rox-playback" }
rox-viz = { path = "../rox-viz" }
gpui = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The workspace schema is derived from the types (ADR 22) so it can't drift.
schemars = "1"
# Shader assets ride the JSON bundle as encoded bytes.
base64 = "0.22"
dirs = "5"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
# The executor panic test stands up its own PlatformDispatcher.
async-task = "4.7"
futures = "0.3"
