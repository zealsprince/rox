[package]
name = "rox-design"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# A genre's color keys on the alias-resolved name, folded the way the library does.
rox-library = { path = "../rox-library" }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
serde = { version = "1", features = ["derive"] }
# Sides' two-shape serde needs a hand-written schema for the workspace bundle (ADR 22).
schemars = "1"
# The icon folder stays in crates/rox/assets, where the flake and the release workflow look.
rust-embed = "8"

[dev-dependencies]
serde_json = "1"
