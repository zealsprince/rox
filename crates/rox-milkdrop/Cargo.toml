[package]
name = "rox-milkdrop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The C API this crate is a safe shell around. Everything unsafe in here
# bottoms out in one of its declarations.
rox-milkdrop-sys = { path = "../rox-milkdrop-sys" }
# The AudioFeed the worker pulls PCM from, the same one the spectrum panel
# reads. This crate reaches no higher than that (ADR 28).
rox-viz = { path = "../rox-viz" }
# The headless GL context. projectM needs a current context and a load proc,
# not a window, and glutin is the one crate in the ecosystem that will hand
# out a surfaceless context on EGL, CGL and WGL behind one API. Default
# features: they are the per-platform backends, and dropping any of them
# drops a platform.
glutin = "0.32"
# The display and window handle types glutin's public API speaks in. Pinned
# to 0.6 because that is glutin 0.32's own major.
raw-window-handle = "0.6"
# Worker mailbox. Preferred over std::sync::mpsc for the disconnect-aware
# recv_deadline the render loop paces itself with. The Windows build already
# has it through tray-icon.
crossbeam-channel = "0.5"
# Preset scanning walks user-pointed directories, so it has to not follow
# symlinks into a loop. Already in the lock through notify.
walkdir = "2"
log = "0.4"
# The thumbnail cache is PNGs on disk. Only the PNG codec: the rest of the
# crate's formats are weight this crate never reads.
image = { version = "0.25", default-features = false, features = ["png"] }

# WGL cannot create a context without an HDC, and an HDC comes from a window,
# so the worker makes a hidden 1x1 one and destroys it on the way out.
# Version 0.61 matches what the rox crate already asks for, so this adds no
# fourth copy of the bindings to the tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The preset scanner's tests need a directory tree they can throw away.
tempfile = "3"
