[package]
name = "rox-panel-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
rox-design = { path = "../rox-design" }
rox-i18n = { path = "../rox-i18n" }
rox-dock = { path = "../rox-dock" }
rox-core = { path = "../rox-core" }
rox-library = { path = "../rox-library" }
rox-panel-kit = { path = "../rox-panel-kit" }
rox-services = { path = "../rox-services" }
rox-viz = { path = "../rox-viz" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Hashes shader sources for the approval gate.
sha2 = "0.10"
# Decodes the images a shader chain declares.
image = "0.25"
# Validates shader-editor buffers without registering a pipeline per pause.
# Keep the version in step with the window API's naga so the verdicts match.
naga = { version = "25.0", features = ["wgsl-in"] }
# The completion provider trait's types; already in the tree via gpui-component.
lsp-types = "0.97"
anyhow = "1"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
