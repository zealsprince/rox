[package]
name = "rox-panels"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
rox-panel-api = { path = "../rox-panel-api" }
rox-panel-kit = { path = "../rox-panel-kit" }
rox-services = { path = "../rox-services" }
rox-core = { path = "../rox-core" }
rox-design = { path = "../rox-design" }
rox-i18n = { path = "../rox-i18n" }
rox-dock = { path = "../rox-dock" }
rox-library = { path = "../rox-library" }
rox-playback = { path = "../rox-playback" }
rox-net = { path = "../rox-net" }
rox-viz = { path = "../rox-viz" }
# libprojectM for the Milkdrop panel (ADR 28). The static C++ library it
# links is why it sits behind one panel.
rox-milkdrop = { path = "../rox-milkdrop" }
# The metadata panel's Romanize button. The engine adds about 520 KiB (measured
# in that crate's manifest); the forty-megabyte dictionary is a download.
rox-romanize = { path = "../rox-romanize" }
# The filter panel's per-column count pass splits across cores. Same version
# the library crate pins.
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
log = "0.4"
dirs = "5"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
