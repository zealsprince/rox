[package]
name = "rox-playback"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The continuation providers (ADR 17) draw their batches straight out of the
# library's store, listens, and vectors.
rox-library = { path = "../rox-library" }
cpal = "0.18"
# The continuation mode is a settings field, and it reads leniently so one
# word a newer build wrote can't take the session shard down with it.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decode per ADR 2: every symphonia codec and container is pure Rust, so we
# take the whole audio matrix (all-codecs + all-formats) without pulling a C
# dependency. No Opus decoder ships in 0.6, so Ogg Opus stays unsupported.
# The tag readers matter for probing, not just tags: without id3v2 the probe
# cannot skip a leading ID3v2 tag, and a tag bigger than the 1 MB probe depth
# (embedded cover art) makes the whole file unreadable.
symphonia = { version = "0.6", default-features = false, features = [
    "aac", "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis",
    "aiff", "caf", "isomp4", "mkv", "ogg", "wav",
    "id3v1", "id3v2", "ape",
] }
# Wait-free SPSC ring for the RT boundary (ADR 3), both the sample ring and the PCM tap.
rtrb = "0.3"
# The logging facade: decode and output errors go through log macros the host
# app's backend (crate::logging in rox) captures. A library only declares the
# facade, never installs a logger.
log = "0.4"
# EBU R128 loudness and true peak for the ReplayGain measurement pass
# (ADR 19), so a file nobody ever analyzed still gets levelled. Pure Rust
# port of libebur128, no C to link, and it merges block histories across
# instances, which is what album gain needs.
ebur128 = "0.1.10"
# The broadcast sink's encoder (ADR 22): MP3 is what every icecast listener
# and browser plays, and this builds LAME from vendored source, so no
# system library enters the build. LGPL beside our AGPL is fine.
mp3lame-encoder = "0.2"
# The icecast source handshake carries Basic auth; same 0.22 line the tree
# already ships.
base64 = "0.22"

# ADR 19's exclusive backend on Linux. Not a new C dependency: cpal already
# links libasound here, so this is the same library reached directly instead
# of through cpal's shared-mode wrapper, which cannot open `hw:` or turn
# ALSA's own resampling off.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"

# ADR 19's exclusive backend on Windows. cpal can't do WASAPI exclusive at
# all, so this reaches the API directly. Same version cpal 0.18 already
# depends on, so the two share one copy of the bindings instead of compiling
# a second set. Features are only the modules the backend names: the audio
# API itself, the KS/multimedia halves that hold WAVE_FORMAT_EXTENSIBLE and
# the two sample subtypes, COM plus the property store for endpoint names,
# and the threading/security pair the high-resolution waitable timer needs.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
