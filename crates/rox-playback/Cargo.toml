[package]
name = "rox-playback"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rox-library = { path = "../rox-library" }
cpal = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decode per ADR 2: every symphonia codec and container is pure Rust.
# The id3v2 reader matters for probing: without it a leading ID3v2 tag bigger
# than the 1 MB probe depth (embedded cover art) makes the file unreadable.
symphonia = { version = "0.6", default-features = false, features = [
    "aac", "adpcm", "alac", "flac", "mp1", "mp2", "mp3", "pcm", "vorbis",
    "aiff", "caf", "isomp4", "mkv", "ogg", "wav",
    "id3v1", "id3v2", "ape",
] }
# The one codec symphonia 0.6 can't decode. No dependencies, no build script,
# no C (ADR 2); its `unsafe` is SIMD intrinsics behind runtime detection.
# Single-stream only, see src/opus.rs.
#
# Chosen over opus-decoder 0.1.1, which panics on ordinary music (a u8 CELT
# anti-collapse mask overflows at 16 blocks) and decodes ~30 dB further from
# libopus. tests/fixtures/dense-transients.opus is the regression;
# tests/fixtures/README.md has the comparison.
opus-pure = "0.2"
# Byte transport for remote sources (ADR 29), the same client rox-net uses.
# This is the layering exception ADR 29 records: the decode loop pulls bytes
# from it synchronously, like a File. See src/http.rs.
ureq = "2"
# Wait-free SPSC ring for the RT boundary (ADR 3): the sample ring and the PCM tap.
rtrb = "0.3"
# ADR 19's resampler, sinc path only (the ratio never changes mid-track).
# Measured at 128 taps, 256x oversampling, 44.1k to 48k stereo: 0.33% of a
# core in release, 1.8% in debug. Construction is 1.6 ms release / 3.0 ms
# debug, so a seek reuses it through `Resampler::reset`.
rubato = { version = "5", default-features = false }
# Libraries only declare the facade; rox_core::logging installs the logger.
log = "0.4"
# EBU R128 loudness and true peak for ReplayGain measurement (ADR 19). Pure
# Rust, and it merges block histories across instances for album gain.
ebur128 = "0.1.10"
# Broadcast sink encoder (ADR 22). Builds LAME from vendored source, so no
# system library enters the build. LGPL beside AGPL is fine.
mp3lame-encoder = "0.2"
# AcoustID fingerprints (ADR 14). A pure Rust port of chromaprint, no C. It
# pulls in rustfft and a second rubato (0.16 beside the engine's 5); the two
# never exchange types, so that costs build time only.
rusty-chromaprint = "0.3"
# Icecast Basic auth and AcoustID's URL-safe fingerprint encoding.
base64 = "0.22"

# ADR 19's exclusive backend on Linux. cpal already links libasound; this
# reaches it directly because cpal can't open `hw:` or turn ALSA resampling off.
[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.11"

# sysctl for the machine's memory, which the live buffer ceiling is a share
# of. Already in the dependency graph. See src/memory.rs.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# ADR 19's exclusive backend on Windows: cpal has no WASAPI exclusive. Same
# version cpal 0.18 depends on, so the bindings compile once.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    # GlobalMemoryStatusEx, for the live buffer's memory ceiling.
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
