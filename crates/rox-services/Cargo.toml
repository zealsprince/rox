[package]
name = "rox-services"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rox-acoustic = { path = "../rox-acoustic" }
rox-core = { path = "../rox-core" }
rox-i18n = { path = "../rox-i18n" }
rox-design = { path = "../rox-design" }
rox-library = { path = "../rox-library" }
rox-playback = { path = "../rox-playback" }
rox-net = { path = "../rox-net" }
rox-viz = { path = "../rox-viz" }
gpui = { workspace = true }
# Cover blur for the backdrop and artist portrait thumbnails.
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
discord-rich-presence = "1.x"
async-channel = "2"
# Already in the tree through rox-core, same 0.4 line.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Already in the tree, same 2.x line.
url = "2"

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
