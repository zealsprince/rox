[package]
name = "rox"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A desktop music player for large, carefully tagged local libraries"

# Read by `cargo deb -p rox --no-build` in the release workflow. Paths under
# target/release resolve against the workspace target dir.
[package.metadata.deb]
maintainer = "Andrew Lake <andrew@zealsprince.com>"
section = "sound"
# No Debian revision, so the artifact is rox_<version>_amd64.deb.
revision = ""
# gpui dlopens libvulkan.so.1, so $auto can't see it. Without it the package
# installs cleanly and then can't open a window.
depends = "$auto, libvulkan1"
recommends = "mesa-vulkan-drivers | vulkan-icd"
# ROX-Filer also installs /usr/bin/rox on Debian 12 and Ubuntu 22.04, so
# without this dpkg stops midway on the overwrite instead of apt asking.
conflicts = "rox-filer"
assets = [
    ["target/release/rox", "usr/bin/", "755"],
    ["target/release/rox-mcp", "usr/bin/", "755"],
    ["assets/app/rox.desktop", "usr/share/applications/", "644"],
    ["assets/app/rox-music.svg", "usr/share/icons/hicolor/scalable/apps/rox.svg", "644"],
    ["assets/app/rox.png", "usr/share/pixmaps/rox.png", "644"],
    ["assets/app/rox.metainfo.xml", "usr/share/metainfo/", "644"],
]

[dependencies]
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
# crate::embeddings holds the app's bookkeeping around a running pass.
rox-acoustic = { path = "../rox-acoustic" }
rox-core = { path = "../rox-core" }
rox-design = { path = "../rox-design" }
rox-dock = { path = "../rox-dock" }
# ADR 27: every user-facing string resolves through its t! macro.
rox-i18n = { path = "../rox-i18n" }
# The control socket's wire side (ADR 22).
rox-ipc = { path = "../rox-ipc" }
rox-library = { path = "../rox-library" }
rox-net = { path = "../rox-net" }
# The seam the panels compile against, including the openers table this
# binary installs so panels can reach its windows.
rox-panel-api = { path = "../rox-panel-api" }
# libprojectM (ADR 28); the binary runs one engine for the app-wide backdrop.
rox-milkdrop = { path = "../rox-milkdrop" }
rox-panel-kit = { path = "../rox-panel-kit" }
# The nine panels that call into the workspace stay in crate::panels.
rox-panels = { path = "../rox-panels" }
rox-playback = { path = "../rox-playback" }
rox-romanize = { path = "../rox-romanize" }
rox-services = { path = "../rox-services" }
rox-viz = { path = "../rox-viz" }
# Home for file pickers, runtime dir for the instance socket, data dir for
# the desktop entry.
dirs = "5"
# The tray icon, and in tests the shipped workspaces' images.
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Artwork rides the control socket as base64.
base64 = "0.22"
# Our own icons over the gpui-component set.
rust-embed = "8"
# The Last.fm imports and the updater make their own blocking calls.
ureq = "2"
# The updater's checksum verify.
sha2 = "0.10"
# Release candidates (1.25.0-rc.1) must sort below 1.25.0 and above 1.24.x:
# the spec's prerelease rule.
semver = "1"
# chrono places the stats window's timestamps in local time.
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# The tag editor's completion provider speaks these types.
lsp-types = "0.97"
anyhow = "1"
# The tag editor's batch find and replace.
regex = "1"
# The zbus backend is pure Rust, so a build needs no system libdbus.
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
# Media-key events from souvlaki's thread to the UI, no poll.
async-channel = "2"
# The workspaces folder watch (ADR 22).
notify-debouncer-full = "0.7"
# The duplicates window's delete goes to the OS trash, never unlink.
# coinit_multithreaded: the delete runs on the WinRT thread pool, already in
# the MTA, where the default CoInitializeEx(STA) fails and the crate panics.
trash = { version = "5", default-features = false, features = ["coinit_multithreaded", "chrono"] }
# The now-playing cover's file:// URL for the OS transport.
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# The glibc malloc knobs; see tune_allocator.
libc = "0.2"
# Quit-to-tray over StatusNotifierItem, on async-io rather than tokio.
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
# The updater unpacks the release tarball.
flate2 = "1"
tar = "0.4"
# Taskbar progress over Unity's LauncherEntry, on async-io rather than tokio.
zbus = { version = "5", default-features = false, features = ["async-io"] }
# cjk_fonts.rs predicts cosmic-text's fallback, so these match cosmic-text's versions.
fontdb = "0.16.2"
sys-locale = "0.3.2"

# Shaders ride blade's pipelines, so on Mac blade must be the renderer, and
# features unify, so this switches the whole Mac render path to blade. Removing
# it goes back to the Metal renderer and shaders stop running.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["macos-blade"] }

# The Win32 HWND souvlaki's SMTC backend binds to.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
# Deflate only: all Compress-Archive writes.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Its defaults are the gtk and libxdo pair only Linux would need.
tray-icon = { version = "0.24", default-features = false }
# The tray's win32 message pump and thread messages.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
# ITaskbarList3: windows-sys has no COM interfaces worth calling.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# gpui's headless TestAppContext and #[gpui::test].
gpui = { workspace = true, features = ["test-support"] }
